# Blueprint do Render — backend TeamAgents (Docker).
# Importa via: Render Dashboard → New → Blueprint → aponta para este repo.
services:
  - type: web
    name: teamagents-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      # Secrets — preencher no dashboard do Render (sync: false = não vai no git)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_INSTANCE
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      # Facebook App — OAuth "Ligar com Facebook", troca de token e debug_token.
      # Obtém em developers.facebook.com → a tua App → Settings → Basic.
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # Google OAuth — Agente Executivo "Ligar Gmail" (Fase 2).
      # Obtém em console.cloud.google.com → APIs & Services → Credentials.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # CORS — depois do deploy do frontend, mete aqui o domínio do Vercel
      # (ex: https://teamagents.vercel.app). Em dev pode ficar "*".
      - key: ALLOWED_ORIGINS
        sync: false
      # Stripe — assinaturas dos planos.
      # STRIPE_SECRET_KEY: dashboard.stripe.com → Developers → API keys (sk_live_…).
      # STRIPE_WEBHOOK_SECRET: criar endpoint /webhook/stripe e copiar o whsec_….
      # FRONTEND_URL: domínio público do app (redirects do Checkout/Portal).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Cron do Agente 3 (Diretor de BI) — relatório semanal por tenant.
  # Render corre em UTC: "59 2 * * 1" = domingo 23:59 em São Paulo (UTC-3),
  # para o dono acordar segunda com a consultoria no WhatsApp.
  - type: cron
    name: teamagents-bi-cron
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    schedule: "59 2 * * 1"
    dockerCommand: python cron_bi_reports.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_INSTANCE
        sync: false

  # Cron do Agente Executivo — corre DE HORA A HORA e dispara cada tarefa
  # automática à sua hora local (campo hora+fuso). "5 * * * *" = ao minuto 5 de
  # cada hora. (Se ainda estiver "0 6 * * *" no dashboard, atualiza para "5 * * * *".)
  - type: cron
    name: teamagents-executivo-cron
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    schedule: "5 * * * *"
    dockerCommand: python cron_executivo.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
